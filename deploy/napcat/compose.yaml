services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always
    environment:
      ACCOUNT: "3763906153 "
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      WSR_ENABLE: "true"
    ports:
      - "6099:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./napcat-data/qq:/app/.config/QQ
      - ./napcat-data/config:/app/napcat/config
      - ./napcat-data/plugins:/app/napcat/plugins
